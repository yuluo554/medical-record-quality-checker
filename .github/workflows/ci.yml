name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消在跑的旧 run（不取消 main 的既有 run）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    # 双 OS 维度：knowledge_dir() 的包内定位是跨 OS 最敏感的代码
    # （site-packages 布局 / 路径分隔符），此前只在 linux 跑过。
    runs-on: ${{ matrix.os }}
    # Windows runner 默认控制台编码是 cp1252，CLI 中文输出会 UnicodeEncodeError；
    # 强制 UTF-8 输出（与 README「控制台中文加 -X utf8」一致）。
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # 显式装全量 extras：防止测试期依赖缺失导致整模块静默跳过（dev 绿但悄悄少跑）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,report]"
          pip install build  # 打包门禁步骤需要
      - name: Run tests
        run: pytest
      - name: CLI smoke
        run: mrqc demo
      - name: Packaging gate (non-editable wheel; knowledge base must load)
        # P0 回归守门：装成 wheel（不带 -e）后在**仓外**目录跑 check，必须 33 条
        # finding（改前 0 条且 rc=0——静默退化成永远说「通过」的空壳）。
        # 全部路径交给脚本内的 Python 处理，规避 Windows/Git-Bash 的 MSYS 路径改写。
        run: python tools/ci_packaging_gate.py